name: Decode SMART Review

on:
  push:
    paths:
      - '.github/workflows/decode-smart.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode SMART HTML
        run: |
          mv SMART_Review_TA6_U1-U3_WEB.html /tmp/smart.gz
          gzip -dc /tmp/smart.gz > SMART_Review_TA6_U1-U3_WEB.html
          file SMART_Review_TA6_U1-U3_WEB.html
          head -c 20 SMART_Review_TA6_U1-U3_WEB.html
      - name: Commit decoded HTML and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SMART_Review_TA6_U1-U3_WEB.html
          git rm .github/workflows/decode-smart.yml
          git commit -m 'Publish SMART Review HTML'
          git push
