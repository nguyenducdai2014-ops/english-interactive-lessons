name: Publish SMART Review

on:
  push:
    paths:
      - '.github/workflows/publish-smart.yml'
      - 'SMART_Review_TA6_U1-U3_WEB.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore SMART WEB file
        env:
          PAYLOAD: ''
        run: |
          python - <<'PY'
          import os, base64, gzip
          data = gzip.decompress(base64.b64decode(os.environ['PAYLOAD']))
          open('SMART_Review_TA6_U1-U3_WEB.html','wb').write(data)
          PY
      - name: Commit SMART WEB file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SMART_Review_TA6_U1-U3_WEB.html
          git diff --cached --quiet || git commit -m 'Add SMART Review TA6 Unit 1-3 WEB'
          git push
